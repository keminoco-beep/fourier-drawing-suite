[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-prompt"
version = "0.1.0"
description = "FDSL v2.1 prompt/tooling: schema validation, deterministic repair, compiler CLI (core scaffold)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Fourier Draw" }]
keywords = ["fdsl", "fourier", "drawing", "prompt", "vector"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Core is stdlib-only (KICKOFF v1 §1.7 / §2.1).
dependencies = []

[project.scripts]
fourier-prompt = "fourier_prompt.cli:main"

[tool.setuptools]
packages = ["fourier_prompt"]
